name: roadmap-lint

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "docs/roadmap.md"
      - "docs/roadmap/**"
      - "scripts/roadmap_lint.py"
      - "tests/test_roadmap_lint.py"
      - ".github/workflows/roadmap-lint.yml"
  push:
    branches: ["main"]
    paths:
      - "AGENTS.md"
      - "docs/roadmap.md"
      - "docs/roadmap/**"
      - "scripts/roadmap_lint.py"
      - "tests/test_roadmap_lint.py"

jobs:
  roadmap-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run roadmap linter
        run: python scripts/roadmap_lint.py
      - name: Run roadmap lint tests
        run: python -m pip install "pytest>=8.3,<9" && python -m pytest -q tests/test_roadmap_lint.py
