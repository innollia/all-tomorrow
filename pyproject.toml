[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "all-tomorrow"
version = "0.1.0"
description = "Personal AI Control Plane"
requires-python = ">=3.13"
dependencies = [
  "PyYAML>=6.0,<7",
  "httpx>=0.28,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "fastapi>=0.116,<1",
  "uvicorn>=0.35,<1",
  "pydantic-ai==2.46.0",
  "dbos==3.0.0",
  "opentelemetry-sdk==1.44.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[project.scripts]
all-tomorrow-api = "all_tomorrow.web:run"

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-asyncio>=0.24,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
where = ["src"]
